<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Million Gold Parfum bottle">
  <title>Million Gold Parfum</title>
  <desc>Placeholder packshot: faceted ingot-style flacon.</desc>
  <defs>
    <linearGradient id="front-million-gold-parfum" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#FBEDC6"/>
      <stop offset="0.42" stop-color="#DCBB78"/>
      <stop offset="1" stop-color="#A8823C"/>
    </linearGradient>
    <linearGradient id="top-million-gold-parfum" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FBEDC6"/>
      <stop offset="1" stop-color="#DCBB78"/>
    </linearGradient>
    <linearGradient id="side-million-gold-parfum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCBB78"/>
      <stop offset="1" stop-color="#A8823C"/>
    </linearGradient>
  </defs>

  <!-- cap: small ingot resting on the flacon -->
  <path d="M142 74 h44 l16 -13 h-44 z" fill="#F0DFB6" opacity="0.92"/>
  <path d="M186 74 l16 -13 v27 l-16 13 z" fill="#F0DFB6" opacity="0.62"/>
  <path d="M142 74 h44 v27 h-44 z" fill="#F0DFB6"/>

  <!-- flacon: front face, top facet, side facet -->
  <path d="M84 132 h152 v208 h-152 z" fill="url(#front-million-gold-parfum)"/>
  <path d="M84 132 l34 -31 h152 l-34 31 z" fill="url(#top-million-gold-parfum)"/>
  <path d="M236 132 l34 -31 v208 l-34 31 z" fill="url(#side-million-gold-parfum)"/>

  <!-- bevel highlights -->
  <path d="M84 132 h152 v5 h-152 z" fill="#FFFFFF" opacity="0.22"/>
  <path d="M92 138 h16 v196 h-16 z" fill="#FFFFFF" opacity="0.16"/>
  <path d="M236 132 l34 -31 v6 l-34 31 z" fill="#FFFFFF" opacity="0.18"/>

  <!-- engraved plate -->
  <rect x="120" y="188" width="80" height="84" fill="#10141C" opacity="0.16"/>
  <text x="160" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#FFFFFF" opacity="0.85">1</text>
  <text x="160" y="252" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="3.5" fill="#FFFFFF" opacity="0.7">MILLION</text>

  <text x="160" y="316" text-anchor="middle" font-family="monospace" font-size="7.5" letter-spacing="3.5" fill="#FFFFFF" opacity="0.5">PARFUM</text>

  <ellipse cx="172" cy="374" rx="104" ry="11" fill="#10141C" opacity="0.1"/>
</svg>
